services:
  postgres:
    image: postgres:16-alpine
    container_name: driff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: driff
      POSTGRES_USER: driff
      POSTGRES_PASSWORD: driff
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driff -d driff"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - driff_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:4
    container_name: driff-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  driff_postgres_data:
